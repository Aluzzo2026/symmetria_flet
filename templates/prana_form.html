{% extends 'base.html' %}
{% block content %}
<form method="POST" class="bg-light p-4 rounded shadow-sm">
    <div class="row mb-4">
        <div class="col-md-5">
            <div class="mb-3 d-flex align-items-center">
                <label class="form-label w-25 me-2">Nama</label>
                <input type="text" name="nama" class="form-control" value="{{ pasien.nama if pasien else '' }}" required>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <label class="form-label w-25 me-2">Domisili</label>
                <input type="text" name="domisili" class="form-control" value="{{ pasien.domisili if pasien else '' }}">
            </div>
        </div>
        <div class="col-md-7">
            <div class="mb-3 d-flex align-items-center">
                <label class="form-label w-25 me-2 text-end">Nama Ibu Kandung</label>
                <input type="text" name="nama_ibu" class="form-control me-4" value="{{ pasien.nama_ibu if pasien else '' }}">
            </div>
            <div class="mb-3 d-flex align-items-center">
                <label class="form-label w-25 me-2 text-end">Tanggal Lahir</label>
                <input type="date" name="tanggal_lahir" id="tanggal_lahir" class="form-control me-4" value="{{ pasien.tanggal_lahir if pasien else '' }}" required>
                
                <label class="form-label me-2">Usia</label>
                <input type="text" id="usia" class="form-control w-25 text-center" readonly style="background-color: #f8f9fa;">
            </div>
        </div>
    </div>

    <!-- Area Background Tab Berubah ke bg-teal-light -->
    <div class="p-3 rounded bg-teal-light">
        <ul class="nav nav-tabs" id="visitTabs" role="tablist">
            {% if pasien and pasien.kunjungan %}
                {% for k in pasien.kunjungan %}
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if loop.last %}active{% endif %}" data-bs-toggle="tab" data-bs-target="#tab_{{ k.id }}" type="button">
                        {{ k.tanggal_kunjungan.strftime('%d%m%y') }}
                    </button>
                </li>
                {% endfor %}
            {% endif %}
            <li class="nav-item" role="presentation">
                <button class="nav-link text-teal fw-bold {% if not pasien or not pasien.kunjungan %}active{% endif %}" id="btn-new-tab" data-bs-toggle="tab" data-bs-target="#tab_new" type="button" onclick="document.getElementById('new_kunjungan').value='yes'">
                    + Kunjungan Baru
                </button>
            </li>
        </ul>

        <div class="tab-content mt-3 bg-white p-3 border border-top-0 rounded-bottom">
            {% if pasien %}
                {% for k in pasien.kunjungan %}
                <div class="tab-pane fade {% if loop.last %}show active{% endif %}" id="tab_{{ k.id }}">
                    <div class="row g-3">
                        <div class="col-md-6"><label>Keluhan & Gejala</label><textarea class="form-control" rows="4" readonly>{{ k.keluhan }}</textarea></div>
                        <div class="col-md-6"><label>Therapi</label><textarea class="form-control" rows="4" readonly>{{ k.terapi }}</textarea></div>
                        <div class="col-md-6"><label>Diagnosa</label><textarea class="form-control" rows="4" readonly>{{ k.diagnosa }}</textarea></div>
                        <div class="col-md-6"><label>Hasil / Progress</label><textarea class="form-control" rows="4" readonly>{{ k.hasil }}</textarea></div>
                    </div>
                </div>
                {% endfor %}
            {% endif %}

            <div class="tab-pane fade {% if not pasien or not pasien.kunjungan %}show active{% endif %}" id="tab_new">
                <input type="hidden" name="new_kunjungan" id="new_kunjungan" value="{% if not pasien %}yes{% else %}no{% endif %}">
                <div class="row g-3">
                    <div class="col-md-6"><label>Keluhan & Gejala</label><textarea class="form-control shadow-sm" name="new_keluhan" rows="4"></textarea></div>
                    <div class="col-md-6"><label>Therapi</label><textarea class="form-control shadow-sm" name="new_terapi" rows="4"></textarea></div>
                    <div class="col-md-6"><label>Diagnosa</label><textarea class="form-control shadow-sm" name="new_diagnosa" rows="4"></textarea></div>
                    <div class="col-md-6"><label>Hasil / Progress</label><textarea class="form-control shadow-sm" name="new_hasil" rows="4"></textarea></div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 text-end">
        <a href="{{ url_for('prana_list') }}" class="btn btn-secondary me-2">Batal</a>
        <button type="submit" class="btn btn-teal px-4">Simpan Data</button>
    </div>
</form>
{% endblock %}
