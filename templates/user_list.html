{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center">
        <a href="{{ url_for('user_form') }}" class="btn btn-teal me-3 px-4">New User</a>
        <h4 class="mb-0">Manajemen User</h4>
    </div>
</div>

<table class="table table-hover w-75">
    <thead>
        <tr>
            <th width="5%">No</th>
            <th>Username</th>
            <th>Role / Hak Akses</th>
            <th width="20%">Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for u in data_user %}
        <tr>
            <td>{{ loop.index }}</td>
            <td class="fw-bold">{{ u.username }}</td>
            <td>
                {% if u.role == 'admin' %}
                    <span class="badge bg-danger">Admin</span>
                {% else %}
                    <span class="badge bg-info text-dark">Terapis</span>
                {% endif %}
            </td>
            <td>
                <a href="{{ url_for('user_form', id=u.id) }}" class="btn btn-sm btn-outline-teal">Edit</a>
                <a href="{{ url_for('user_delete', id=u.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Yakin ingin menghapus user ini?')">Hapus</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
